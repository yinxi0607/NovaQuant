services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB:-novaquant}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER:-novaquant}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_POSTGRES_USER:-novaquant} -d ${DOCKER_POSTGRES_DB:-novaquant}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: seed
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  checkdata:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: checkdata
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mcp-db:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: mcp-db
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      redis:
        condition: service_started
      seed:
        condition: service_completed_successfully
    ports:
      - "${API_PORT}:${API_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: agent
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AGENT_PORT}:${AGENT_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${AGENT_PORT}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: collector
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${COLLECTOR_PORT}:${COLLECTOR_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${COLLECTOR_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: analyzer
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ANALYZER_PORT}:${ANALYZER_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ANALYZER_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  alerts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: alerts
    env_file: .env
    environment:
      PG_DSN: postgres://${DOCKER_POSTGRES_USER:-novaquant}:${DOCKER_POSTGRES_PASSWORD:-password}@db:5432/${DOCKER_POSTGRES_DB:-novaquant}?sslmode=disable
      REDIS_URL: ${DOCKER_REDIS_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ALERTS_PORT}:${ALERTS_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ALERTS_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED}
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "${WEB_PORT}"]
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT}"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  db_data:
