services:
  redis:
    image: redis:7-alpine

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: seed
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      seed:
        condition: service_completed_successfully
    ports:
      - "${API_PORT}:${API_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${API_PORT}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: agent
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AGENT_PORT}:${AGENT_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${AGENT_PORT}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: collector
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${COLLECTOR_PORT}:${COLLECTOR_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${COLLECTOR_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: analyzer
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ANALYZER_PORT}:${ANALYZER_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ANALYZER_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  alerts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: alerts
    env_file: .env
    environment:
      PG_DSN: ${DOCKER_PG_DSN}
      REDIS_URL: ${DOCKER_REDIS_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ALERTS_PORT}:${ALERTS_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${ALERTS_PORT}/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:${API_PORT}/api/v1
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED}
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "${WEB_PORT}"]
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WEB_PORT}"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: timescale/timescaledb:latest-pg16
    profiles: ["db"]
    environment:
      POSTGRES_DB: novaquant
      POSTGRES_USER: novaquant
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
